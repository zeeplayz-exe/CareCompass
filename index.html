<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareCompass – Symptom guide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8f6;--sf:#fff;--tx:#12302b;--mu:#5b7570;--ac:#0f8f7e;--ac2:#14b8a6;--bd:#d6e6e1;--ok:#e3f6ee;--wa:#fff3d9;--er:#fde4e1;--okt:#0b6b4f;--wat:#8a5a00;--ert:#a3281d;--sh:0 10px 30px rgba(15,143,126,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1917;--sf:#142724;--tx:#e6f4f1;--mu:#8fb0a9;--ac:#2dd4bf;--ac2:#14b8a6;--bd:#233f3a;--ok:#12332a;--wa:#3a2f12;--er:#3d1b19;--okt:#6ee7b7;--wat:#fcd34d;--ert:#fca5a5;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0c1917;--sf:#142724;--tx:#e6f4f1;--mu:#8fb0a9;--ac:#2dd4bf;--ac2:#14b8a6;--bd:#233f3a;--ok:#12332a;--wa:#3a2f12;--er:#3d1b19;--okt:#6ee7b7;--wat:#fcd34d;--ert:#fca5a5;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Nunito","Segoe UI",system-ui,sans-serif;transition:background .4s,color .4s;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center}
.logo i{font-style:normal;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:12px;padding:4px 8px}
button{font:inherit;color:inherit;cursor:pointer}
.th{background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;transition:.3s}
.th:hover{transform:scale(1.05)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:18px}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:26px;box-shadow:var(--sh);animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15;margin:.2em 0 .3em;letter-spacing:-.02em}
h2{font-size:24px;margin:0 0 6px}h3{margin:18px 0 8px;font-size:17px}
p{margin:.4em 0}.mu{color:var(--mu)}
.hero{font-size:56px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.how{display:grid;gap:10px;margin:18px 0}
.how div{display:flex;gap:12px;align-items:flex-start;background:var(--bg);padding:12px 14px;border-radius:16px}
.how span{font-size:24px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:16px;padding:13px 26px;font-weight:700;transition:.25s;box-shadow:0 6px 18px rgba(20,184,166,.35)}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.g{background:var(--bg);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.disc{background:var(--wa);color:var(--wat);padding:12px 14px;border-radius:14px;font-size:14px;margin:14px 0}
input[type=text]{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:12px}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:14px;transition:.2s}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--bg);border:2px solid transparent;border-radius:18px;padding:14px 10px;text-align:center;transition:.25s}
.tile:hover{transform:translateY(-3px);border-color:var(--ac2)}.tile.on{border-color:var(--ac);background:var(--ok)}
.tile em{display:block;font-style:normal;font-size:30px}.tile small{color:var(--mu);font-size:12px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.res{border-radius:18px;padding:16px 18px;font-weight:700;margin-bottom:6px}
.res.ok{background:var(--ok);color:var(--okt)}.res.wa{background:var(--wa);color:var(--wat)}.res.er{background:var(--er);color:var(--ert)}
.res p{font-weight:400;margin:4px 0 0}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
.ck{display:flex;gap:10px;align-items:center;margin:8px 0}.ck input{width:20px;height:20px;accent-color:var(--ac)}
.sos{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#d93025;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:800;box-shadow:0 8px 24px rgba(217,48,37,.45);z-index:20}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;animation:in .3s}
.md{background:var(--sf);border-radius:24px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.lk{text-decoration:none;display:inline-block;text-align:center}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:40}
@media print{.sos,header,.row,.bar{display:none}}
:root[data-theme="light"]{--bg:#f4f6f9;--sf:#fff;--tx:#0e1a2b;--mu:#556377;--ac:#0b5cab;--ac2:#1473c9;--bd:#dde3ec;--ok:#e6f4ee;--wa:#fff4de;--er:#fde8e6;--okt:#0b6b4f;--wat:#8a5a00;--ert:#a3281d;--sh:0 1px 2px rgba(14,26,43,.06),0 8px 24px rgba(14,26,43,.06)}
:root[data-theme="dark"]{--bg:#0b121c;--sf:#121c2a;--tx:#e8eef6;--mu:#93a3b8;--ac:#2f7fe6;--ac2:#4c9aff;--bd:#223148;--ok:#10281f;--wa:#2e2510;--er:#33181a;--okt:#6ee7b7;--wat:#fcd34d;--ert:#fca5a5;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif}
h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:700}
.card{border-radius:16px;padding:30px}
.btn{border-radius:10px;background:var(--ac);color:#fff;box-shadow:none}.btn:hover{transform:none;background:var(--ac2)}.btn.g{background:var(--bg);color:var(--tx)}
.tile,.chip,.th,input[type=text],.how div,.res,.disc{border-radius:10px}
.tile{text-align:left;padding:14px}.tile em{display:none}.tile:hover{transform:none}
select.th{padding:8px 10px;color:var(--tx)}
.hero{font-size:0;animation:none;width:52px;height:52px;border-radius:14px;background:var(--ac);position:relative}.hero::after{content:"✚";font-size:26px;color:#fff;position:absolute;inset:0;display:grid;place-items:center}
.how{counter-reset:s}.how>div>span,.how .mu{display:none}.how div{align-items:center}.how div::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
